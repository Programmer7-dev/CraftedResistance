name = "craftedresistance-shop"
main = "worker.js"
compatibility_date = "2024-11-01"

# Deploy with `npx wrangler deploy` from this folder.
#
# Create the namespace first:
#   npx wrangler kv namespace create ENTITLEMENTS
# and paste the id below.
[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: give the download counter its own namespace instead of sharing
# ENTITLEMENTS. Keys are prefixed either way, so sharing is safe.
#   npx wrangler kv namespace create DOWNLOADS
# [[kv_namespaces]]
# binding = "DOWNLOADS"
# id = "REPLACE_WITH_DOWNLOADS_NAMESPACE_ID"

[vars]
# The GitHub Pages site. Keep the path: the Worker builds the success and cancel URLs from it.
SITE_URL = "https://programmer7-dev.github.io/CraftedResistance"

# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
