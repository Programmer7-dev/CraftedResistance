<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page not found — Crafted Resistance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="That page isn't part of the Crafted Resistance site.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d11">
  <meta name="application-name" content="Crafted Resistance">

  <link rel="icon" href="https://programmer7-dev.github.io/CraftedResistance/favicon.ico" sizes="any" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="https://programmer7-dev.github.io/CraftedResistance/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="https://programmer7-dev.github.io/CraftedResistance/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="https://programmer7-dev.github.io/CraftedResistance/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://programmer7-dev.github.io/CraftedResistance/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://programmer7-dev.github.io/CraftedResistance/apple-touch-icon.png">

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, #1c2230 0, #0b0d11 55%),
        #0b0d11;
      color: #e9edf4;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(520px, 100%);
      padding: 40px 32px;
      text-align: center;
      background: rgba(20, 24, 33, .88);
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 22px;
      box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .9);
    }
    img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 18px; }
    .eyebrow {
      margin: 0 0 8px;
      color: #98a2b3;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-family: "Chakra Petch", Inter, system-ui, sans-serif;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    .lede { margin: 0 auto 28px; max-width: 360px; color: #98a2b3; line-height: 1.6; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: linear-gradient(120deg, #ff7a3d, #ffb347 55%, #ffd479);
      color: #1a120d;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 14px 30px -14px rgba(255, 122, 61, .8);
    }
    .button:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <main class="card">
    <img src="Logo.png" alt="Crafted Resistance logo" width="96" height="96">
    <p class="eyebrow">404</p>
    <h1>Page not found</h1>
    <p class="lede">That page isn't here. Head back to the facility.</p>
    <p><a class="button" href="https://programmer7-dev.github.io/CraftedResistance/">Return to Crafted Resistance</a></p>
  </main>
</body>
</html>
